# issue_comment loads this workflow from the default branch; no PR files run.
# Verdict: review-verdict v1 head=<40-hex sha> approve evidence=<https url>
name: Review Verdict

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  verdict:
    name: Review verdict
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'review-verdict v1')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: sandbox-review
    permissions:
      pull-requests: read
    steps:
      - name: Authorize commenter and parse verdict
        id: verdict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          EVENT_STATE: ${{ github.event.issue.state }}
          LC_ALL: C
        run: |
          refuse() { printf '::error::verdict refused: %s\n' "$1"; exit 1; }
          [[ "$EVENT_STATE" == open ]] || refuse 'comment was not written on an open pull request'
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin | write) ;;
            *) refuse 'commenter does not have write access' ;;
          esac

          pattern='^review-verdict v1 head=([0-9a-f]{40}) approve evidence=(https://[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+(/[^[:space:]]*)?)$'
          head=
          evidence=
          while IFS= read -r line; do
            if [[ ${line%$'\r'} =~ $pattern ]]; then
              [[ -z "$head" ]] || refuse 'more than one verdict line'
              head=${BASH_REMATCH[1]}
              evidence=${BASH_REMATCH[2]}
            fi
          done <<< "$COMMENT_BODY"
          [[ -n "$head" ]] || refuse 'no well-formed verdict line'
          printf 'head=%s\nevidence=%s\n' "$head" "$evidence" >> "$GITHUB_OUTPUT"

      - name: Mint sandbox App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          # With owner and repositories unset, the token is scoped to this repository only.
          app-id: ${{ vars.SANDBOX_REVIEW_APP_ID }}
          private-key: ${{ secrets.SANDBOX_REVIEW_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Verify live pull request and post review check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
          COMMENT_CREATED: ${{ github.event.comment.created_at }}
          VERDICT_HEAD: ${{ steps.verdict.outputs.head }}
          EVIDENCE: ${{ steps.verdict.outputs.evidence }}
          LC_ALL: C
        run: |
          refuse() { printf '::error::verdict refused: %s\n' "$1"; exit 1; }
          # The latest base change must predate the verdict, even if the base was changed back.
          # shellcheck disable=SC2016 # GraphQL variables, not shell expansions
          pr=$(gh api graphql -F n="$PR_NUMBER" -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -f query='
            query($o: String!, $r: String!, $n: Int!) {
              repository(owner: $o, name: $r) {
                defaultBranchRef { name }
                pullRequest(number: $n) {
                  state headRefOid baseRefName
                  timelineItems(last: 1, itemTypes: [BASE_REF_CHANGED_EVENT]) {
                    nodes { ... on BaseRefChangedEvent { createdAt } }
                  }
                }
              }
            }' --jq '.data.repository | .defaultBranchRef.name as $default | .pullRequest |
              "\(.state) \(.headRefOid) \(.baseRefName) \($default) \(.timelineItems.nodes[0].createdAt // "-")"')
          read -r state head base default base_changed <<< "$pr"
          [[ "$state" == OPEN ]] || refuse 'pull request is not open'
          [[ "$head" == "$VERDICT_HEAD" ]] || refuse 'verdict does not name the current head'
          [[ "$base" == "$default" && "$default" == "$DEFAULT_BRANCH" ]] || refuse 'pull request does not target the default branch'
          [[ "$base_changed" == - || "$base_changed" < "$COMMENT_CREATED" ]] || refuse 'pull request was retargeted since the verdict'

          GH_TOKEN=$APP_TOKEN gh api "repos/$GITHUB_REPOSITORY/check-runs" -f name=review -f head_sha="$head" \
            -f status=completed -f conclusion=success \
            -f 'output[title]=Review verdict' \
            -f "output[summary]=Approved by @$COMMENTER. Evidence: $EVIDENCE. Verdict: $COMMENT_URL" >/dev/null
          printf 'review check posted on %s\n' "$head"
